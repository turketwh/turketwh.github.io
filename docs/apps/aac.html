<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101827">
  <title>AAC Answer Board</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, sans-serif;
      background: #101827;
      color: #fff;
    }

    *, *::before, *::after { box-sizing: border-box; }

    body { margin: 0; }

    main {
      display: grid;
      place-items: center;
      min-block-size: 100vh;
      min-block-size: 100svh;
      padding: max(16px, env(safe-area-inset-top))
               max(16px, env(safe-area-inset-right))
               max(16px, env(safe-area-inset-bottom))
               max(16px, env(safe-area-inset-left));
    }

    .board {
      display: grid;
      grid-template-rows: 1fr auto;
      gap: 24px;
      inline-size: min(100%, 42rem);
      min-block-size: min(42rem, 85svh);
    }

    .answers {
      display: grid;
      grid-template-rows: repeat(3, minmax(96px, 1fr));
      gap: clamp(24px, 4svh, 40px);
      min-inline-size: 0;
      margin: 0;
      padding: 0;
      border: 0;
    }

    .answer {
      position: relative;
      display: grid;
    }

    .answer input {
      position: absolute;
      z-index: 1;
      inset: 0;
      inline-size: 100%;
      block-size: 100%;
      margin: 0;
      opacity: 0;
      cursor: pointer;
      touch-action: manipulation;
    }

    .label {
      display: grid;
      place-items: center;
      padding: 16px 38px;
      border: 3px solid #91a3bd;
      border-radius: 20px;
      background: #233651;
      font-size: clamp(2rem, 7vw, 4.75rem);
      font-weight: 750;
      line-height: 1.05;
      text-align: center;
      overflow-wrap: anywhere;
    }

    .answer:last-child .label { font-size: clamp(1.75rem, 6vw, 3.5rem); }

    input:checked + .label {
      border-color: #fff5c7;
      background: #ffd34e;
      color: #151a24;
    }

    input:checked + .label::after {
      content: "";
      position: absolute;
      inset-block-start: 15px;
      inset-inline-end: 15px;
      inline-size: 12px;
      block-size: 21px;
      border: solid currentColor;
      border-width: 0 4px 4px 0;
      transform: rotate(45deg);
    }

    .reset {
      justify-self: center;
      min-block-size: 48px;
      padding: 8px 24px;
      border: 2px solid #91a3bd;
      border-radius: 12px;
      background: #233651;
      color: inherit;
      font: 650 1rem system-ui, -apple-system, sans-serif;
      cursor: pointer;
      touch-action: manipulation;
    }

    .reset:active { background: #3b5476; }

    input:focus-visible + .label, .reset:focus-visible {
      outline: 3px solid #fff;
      outline-offset: 4px;
    }

    @media (orientation: landscape) and (max-height: 440px) and (min-width: 560px) {
      .board { inline-size: min(100%, 54rem); }

      .answers {
        grid-template: minmax(96px, 1fr) / repeat(3, minmax(0, 1fr));
      }

      .label { padding-inline: 26px; }
    }
  </style>
</head>
<body>
  <main>
    <form class="board" autocomplete="off">
      <fieldset class="answers" aria-label="Choose an answer">
        <label class="answer">
          <input type="radio" name="answer" value="yes">
          <span class="label">Yes</span>
        </label>
        <label class="answer">
          <input type="radio" name="answer" value="no">
          <span class="label">No</span>
        </label>
        <label class="answer">
          <input type="radio" name="answer" value="need-time">
          <span class="label">Need Time To Think</span>
        </label>
      </fieldset>
      <button class="reset" type="reset">Reset</button>
    </form>
  </main>
</body>
</html>
